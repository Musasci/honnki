<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://docs.google.com; img-src 'self' data: https://i.ytimg.com https://img.youtube.com; media-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; upgrade-insecure-requests; block-all-mixed-content" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="description" content="音楽とことば。夜の静けさに寄り添う。" />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <title>翠山海翔 | Night Music</title>
  <link rel="canonical" href="https://musasci.github.io/honnki/" />
  <link rel="stylesheet" href="site.css" />
  <script src="app.js" defer></script>
</head>
<body data-page="home" class="theme-artist">
  <a class="skip" href="#main">本文へスキップ</a>
  <header class="top top--compact">
    <div class="wrap top__inner">
      <a class="brand brand--mini" href="index.html" aria-label="ホーム">
        <span class="brand__mark" aria-hidden="true">
          <span class="mark__spark"></span>
          <span class="mark__spark mark__spark--2"></span>
          <span class="mark__spark mark__spark--3"></span>
        </span>
        <span class="brand__name">
          <span class="brand__jp">翠山海翔</span>
          <span class="brand__en">Kaito Midoriyama</span>
        </span>
      </a>

      <nav class="nav nav--mini" aria-label="グローバルナビ">
        <a href="blog.html">記事</a>
        <a href="videos.html">動画</a>
        <a href="contact.html">連絡</a>
      </nav>
    </div>
  </header>

  <main id="main" class="section section--hero">
    <div class="wrap">
      <div class="hero hero--mini">
        <h1 class="hero__title" data-reveal="slow d1">ふとした<span class="grad">夜</span>を歌に変える</h1>
        <p class="muted" data-reveal="d2">記事 / 動画</p>
      </div>

      <div class="grid grid--home" data-reveal="d2">
        <section class="card card--home" aria-label="Latest post">
          <div class="card__body">
            <div class="kicker">最新の記事</div>
            <div id="homeLatestPost" class="miniList" aria-busy="true"></div>
            <div class="row row--end">
              <a class="btn btn--ghost" href="blog.html">記事</a>
            </div>
          </div>
        </section>

        <section class="card card--home" aria-label="Latest video">
          <div class="card__body">
            <div class="kicker">最新の動画</div>
            <div id="homeLatestVideo" class="miniList" aria-busy="true"></div>
            <div class="row row--end">
              <a class="btn btn--ghost" href="videos.html">動画</a>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>
  <footer class="footer footer--compact">
    <div class="wrap footer__inner">
      <small>© <span data-year></span> 翠山海翔</small>
      <span class="footer__links">
        <a href="privacy.html">プライバシー</a>
      </span>
    </div>
  </footer>
</body>
</html>
